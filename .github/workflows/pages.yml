name: Build and deploy preservation report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and verify the harvester
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pyflakes
          PYTHONPATH=. python -m pyflakes daad_harvester/
          PYTHONPATH=. python -m pytest tests/ -q

      - name: Generate deterministic public report data
        run: |
          mkdir -p pages-output
          PYTHONPATH=. python -m daad_harvester --phase catalog --output-dir pages-output --log-level INFO
          PYTHONPATH=. python -m daad_harvester --phase organize --resume --output-dir pages-output --log-level INFO
          PYTHONPATH=. python -m daad_harvester --phase report --resume --output-dir pages-output --log-level INFO

      - name: Set up Node
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node runtime and cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the static viewer
        working-directory: web/report-viewer
        env:
          VITE_BASE_PATH: /DAAD-harvester/
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          cp ../../pages-output/report_data.json public/report_data.json
          if [ -f ../../pages-output/detection_tables.h ]; then cp ../../pages-output/detection_tables.h public/detection_tables.h; fi
          if [ -f ../../pages-output/library/manifest.json ]; then mkdir -p public/library && cp ../../pages-output/library/manifest.json public/library/manifest.json; fi
          pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/report-viewer/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
