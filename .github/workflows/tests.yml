name: Tests

# Runs on every push (so branches get feedback before a PR exists) and on
# PRs targeting main. There was no CI at all before this workflow: 15+
# consecutive commits landed on main with a fully green local test suite
# while the app's primary interactive mode (--tui) crashed on every single
# run. Wiring this into GitHub Actions means that class of regression is
# caught automatically instead of relying on someone re-discovering it by
# running the app for real.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Best-effort: the test suite mocks subprocess/CLI extraction fallbacks
      # (see tests/test_unpack.py), so it does not require these binaries to
      # pass. Installed anyway so CI also validates the README's own install
      # instructions, without letting one unavailable package (e.g. unrar,
      # which needs multiverse on some runners) fail the whole job.
      - name: Install system extraction tools (best-effort)
        run: |
          sudo apt-get update
          for pkg in p7zip-full unzip unar cabextract arj lhasa unrar-free; do
            sudo apt-get install -y "$pkg" || echo "::warning::package '$pkg' unavailable on this runner; skipping (tests mock CLI tools, so this alone won't fail the job)"
          done

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes daad_harvester/

      - name: Run test suite
        run: PYTHONPATH=. python -m pytest tests/ -v

      - name: CLI smoke test
        # Cheap, real end-to-end check of module wiring (imports, argparse
        # setup) that unit tests alone don't exercise, since they import
        # submodules directly rather than running `python -m daad_harvester`.
        run: |
          python -m daad_harvester --version
          python -m daad_harvester --help
