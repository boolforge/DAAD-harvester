<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boxTarget" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="280" rx="12" fill="url(#bg)"/>

  <!-- Title Header -->
  <text x="450" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    DAAD HARVESTER — HIGH-PERFORMANCE ETL &amp; FORENSIC PIPELINE ARCHITECTURE
  </text>

  <!-- Flow Arrows -->
  <path d="M 160 120 L 180 120" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 310 120 L 330 120" stroke="#3b82f6" stroke-width="3"/>
  <path d="M 460 120 L 480 120" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 610 120 L 630 120" stroke="#a855f7" stroke-width="3"/>
  <path d="M 760 120 L 780 120" stroke="#22c55e" stroke-width="3"/>

  <!-- Stage 1: Discovery -->
  <g filter="url(#shadow)">
    <rect x="30" y="65" width="130" height="110" rx="8" fill="url(#box1)" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">1. Discovery</text>
    <text x="95" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Archive.org, ZXDB</text>
    <text x="95" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">IF Archive, Aminet</text>
    <text x="95" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">GitHub &amp; WikiCAAD</text>
    <text x="95" y="157" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">itch.io &amp; IFDB</text>
  </g>

  <!-- Stage 2: Fetch -->
  <g filter="url(#shadow)">
    <rect x="180" y="65" width="130" height="110" rx="8" fill="url(#box1)" stroke="#3b82f6" stroke-width="2"/>
    <text x="245" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#60a5fa" text-anchor="middle">2. Fetch</text>
    <text x="245" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Async HTTP/2</text>
    <text x="245" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rate Limiting</text>
    <text x="245" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Proxy Rotation</text>
    <text x="245" y="157" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Wayback CDX Recovery</text>
  </g>

  <!-- Stage 3: Unpack -->
  <g filter="url(#shadow)">
    <rect x="330" y="65" width="130" height="110" rx="8" fill="url(#box1)" stroke="#38bdf8" stroke-width="2"/>
    <text x="395" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">3. Unpack</text>
    <text x="395" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Recursive Container</text>
    <text x="395" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ZIP, 7Z, RAR, DSK</text>
    <text x="395" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">TAP, D64, LHA, ARJ</text>
    <text x="395" y="157" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ZOO, ARC, CAB, TAR</text>
  </g>

  <!-- Stage 4: Fingerprint -->
  <g filter="url(#shadow)">
    <rect x="480" y="65" width="130" height="110" rx="8" fill="url(#box1)" stroke="#a855f7" stroke-width="2"/>
    <text x="545" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">4. Fingerprint</text>
    <text x="545" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">DAAD Process Table</text>
    <text x="545" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Vocab Token Check</text>
    <text x="545" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">System Text Scan</text>
    <text x="545" y="157" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Multi-Hash Suite</text>
  </g>

  <!-- Stage 5: Synthesize -->
  <g filter="url(#shadow)">
    <rect x="630" y="65" width="130" height="110" rx="8" fill="url(#box1)" stroke="#22c55e" stroke-width="2"/>
    <text x="695" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4ade80" text-anchor="middle">5. Synthesize</text>
    <text x="695" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ScummVM Header</text>
    <text x="695" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">JSON Catalog</text>
    <text x="695" y="142" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Structured Logs</text>
    <text x="695" y="157" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">MD5/SHA Collisions</text>
  </g>

  <!-- Stage Target: ScummVM -->
  <g filter="url(#shadow)">
    <rect x="780" y="65" width="100" height="110" rx="8" fill="url(#boxTarget)" stroke="#f59e0b" stroke-width="2"/>
    <text x="830" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fef08a" text-anchor="middle">ScummVM</text>
    <text x="830" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Target Engine</text>
    <text x="830" y="145" font-family="sans-serif" font-size="9" fill="#fde047" text-anchor="middle">detection_tables.h</text>
  </g>

  <!-- Footer Banner -->
  <rect x="30" y="200" width="850" height="50" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0369a1" stroke-width="1"/>
  <text x="455" y="222" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Stateful Local Storage: SQLite (state.db) | WAL Mode | Multi-Thread Resumable</text>
  <text x="455" y="238" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Tagged Logs: daad_general.log, daad_games.log, daad_errors.log, daad_compression_errors.log, daad_downloads.log, daad_discovery.log</text>
</svg>
