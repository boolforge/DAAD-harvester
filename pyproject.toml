[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daad-harvester"
version = "2.0.0"
description = "Scalable, asynchronous enterprise-grade data pipeline for DAAD game preservation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "DAAD Harvester contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiofiles>=23.0.0",
  "beautifulsoup4>=4.12.0",
  "httpx>=0.25.0",
  "loguru>=0.7.0",
  "lxml>=4.9.0",
  "markdown>=3.7",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "py7zr>=0.20.0; sys_platform != 'android'",
  "rarfile>=4.0",
  "rich>=13.0.0",
  "selectolax>=0.4.0",
  "sqlalchemy>=2.0.0",
  "structlog>=23.0.0",
  "tenacity>=8.2.0",
  "typer>=0.12.0",
  "xxhash>=3.0.0",
  "zipfile-deflate64>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pyflakes>=3.0.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
daad-harvester = "daad_harvester.cli:app"

[tool.setuptools.packages.find]
include = ["daad_harvester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
